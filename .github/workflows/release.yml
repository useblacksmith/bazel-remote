name: create release binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published patchset release tag (vX.Y.Z-blacksmith.N)
        required: true
        type: string

permissions:
  contents: read

env:
  # rules_go 0.57.0 supports Bazel 7.x/8.x. Bazel 9 removes Starlark APIs it uses.
  USE_BAZEL_VERSION: 8.4.2

jobs:
  validate:
    name: validate patchset release source
    runs-on: blacksmith-4vcpu-ubuntu-2204
    outputs:
      release_tag: ${{ steps.release_source.outputs.release_tag }}
      source_sha: ${{ steps.release_source.outputs.source_sha }}
      version: ${{ steps.release_source.outputs.version }}
    steps:
      - name: checkout release tag
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: validate release source
        id: release_source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-blacksmith\.[0-9]+$ ]]; then
            echo "::error::release tag must match vX.Y.Z-blacksmith.N"
            exit 1
          fi

          if ! git show-ref --verify --quiet refs/remotes/origin/patchset; then
            echo "::error::origin/patchset was not fetched"
            exit 1
          fi

          source_sha="$(git rev-parse 'HEAD^{commit}')"
          if ! git merge-base --is-ancestor "$source_sha" refs/remotes/origin/patchset; then
            echo "::error::release tag $RELEASE_TAG must be reachable from the current patchset branch"
            exit 1
          fi

          release_state="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '[.draft, (.published_at != null)] | @tsv')"
          if [[ "$release_state" != $'false\ttrue' ]]; then
            echo "::error::release tag $RELEASE_TAG must have a published GitHub Release"
            exit 1
          fi

          {
            echo "release_tag=$RELEASE_TAG"
            echo "source_sha=$source_sha"
            echo "version=${RELEASE_TAG#v}"
          } >> "$GITHUB_OUTPUT"

  linux:
    name: create linux ${{ matrix.arch }} binary
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            artifact_arch: x86_64
            runner: blacksmith-4vcpu-ubuntu-2204
          - arch: arm64
            artifact_arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2204-arm
    # Build each cgo target on its native architecture. The Ubuntu 22.04 images
    # also keep the glibc floor low for the dynamically-linked Linux binaries.
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - name: build ${{ matrix.arch }}
        run: |
          set -eu
          target="//:bazel-remote-linux-${{ matrix.arch }}"
          output="$(pwd)/bazel-remote-${{ env.VERSION }}-linux-${{ matrix.artifact_arch }}"
          bazelisk build "$target"
          bazelisk run --run_under "cp -f " "$target" "$output"
      - name: upload linux ${{ matrix.arch }} binary
        id: upload-release-assets-linux
        uses: xresloader/upload-to-github-release@7c5757a90c0bcf0c0e1741da8f2abd7b85e675d0 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: bazel-remote-${{ env.VERSION }}-linux-${{ matrix.artifact_arch }}
          overwrite: true
          tag_name: ${{ env.RELEASE_TAG }}

  mac:
    name: create mac ${{ matrix.arch }} binary
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: blacksmith-6vcpu-macos-15
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - name: build ${{ matrix.arch }}
        run: |
          set -eu
          target="//:bazel-remote-darwin-${{ matrix.arch }}"
          output="$(pwd)/bazel-remote-${{ env.VERSION }}-darwin-${{ matrix.arch }}"
          bazelisk build "$target"
          bazelisk run --run_under "cp -f " "$target" "$output"
      - name: upload darwin ${{ matrix.arch }} binary
        id: upload-release-assets-darwin
        uses: xresloader/upload-to-github-release@7c5757a90c0bcf0c0e1741da8f2abd7b85e675d0 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: bazel-remote-${{ env.VERSION }}-darwin-${{ matrix.arch }}
          overwrite: true
          tag_name: ${{ env.RELEASE_TAG }}
