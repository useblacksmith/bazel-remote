name: create release binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published patchset release tag (vX.Y.Z-blacksmith.N)
        required: true
        type: string

permissions:
  contents: read

env:
  # rules_go 0.57.0 supports Bazel 7.x/8.x. Bazel 9 removes Starlark APIs it uses.
  USE_BAZEL_VERSION: 8.4.2

jobs:
  validate:
    name: validate patchset release source
    runs-on: blacksmith-4vcpu-ubuntu-2204
    outputs:
      release_tag: ${{ steps.release_source.outputs.release_tag }}
      source_sha: ${{ steps.release_source.outputs.source_sha }}
      version: ${{ steps.release_source.outputs.version }}
    steps:
      - name: checkout release tag
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: validate release source
        id: release_source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-blacksmith\.[0-9]+$ ]]; then
            echo "::error::release tag must match vX.Y.Z-blacksmith.N"
            exit 1
          fi

          if ! git show-ref --verify --quiet refs/remotes/origin/patchset; then
            echo "::error::origin/patchset was not fetched"
            exit 1
          fi

          source_sha="$(git rev-parse 'HEAD^{commit}')"
          if ! git merge-base --is-ancestor "$source_sha" refs/remotes/origin/patchset; then
            echo "::error::release tag $RELEASE_TAG must be reachable from the current patchset branch"
            exit 1
          fi

          release_state="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '[.draft, (.published_at != null)] | @tsv')"
          if [[ "$release_state" != $'false\ttrue' ]]; then
            echo "::error::release tag $RELEASE_TAG must have a published GitHub Release"
            exit 1
          fi

          {
            echo "release_tag=$RELEASE_TAG"
            echo "source_sha=$source_sha"
            echo "version=${RELEASE_TAG#v}"
          } >> "$GITHUB_OUTPUT"

  linux:
    name: create linux binaries
    needs: validate
    permissions:
      contents: write
    # Use the oldest available Ubuntu image to keep the glibc version low for the
    # published, dynamically-linked (cgo, non-static) linux-x86_64 binary. Building
    # on a newer image would raise the glibc floor and break older target systems.
    runs-on: blacksmith-4vcpu-ubuntu-2204
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - name: build amd64
        run: |
          set -eu
          bazelisk build //:bazel-remote-linux-amd64
          bazelisk run --run_under "cp -f " //:bazel-remote-linux-amd64 $(pwd)/bazel-remote-${{ env.VERSION }}-linux-x86_64
      - name: build arm64
        run: |
          set -eu
          bazelisk build //:bazel-remote-linux-arm64
          bazelisk run --run_under "cp -f " //:bazel-remote-linux-arm64 $(pwd)/bazel-remote-${{ env.VERSION }}-linux-arm64
      - name: upload linux binaries
        id: upload-release-assets-linux
        uses: xresloader/upload-to-github-release@7c5757a90c0bcf0c0e1741da8f2abd7b85e675d0 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: bazel-remote-${{ env.VERSION }}-linux-*
          overwrite: true
          tag_name: ${{ env.RELEASE_TAG }}

  mac:
    name: create mac binaries
    needs: validate
    permissions:
      contents: write
    runs-on: blacksmith-6vcpu-macos-15
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - name: build amd64
        run: |
          set -eu
          bazelisk build //:bazel-remote-darwin-amd64
          bazelisk run --run_under "cp -f " //:bazel-remote-darwin-amd64 $(pwd)/bazel-remote-${{ env.VERSION }}-darwin-amd64
      - name: build arm64
        run: |
          set -eu
          bazelisk build //:bazel-remote-darwin-arm64
          bazelisk run --run_under "cp -f " //:bazel-remote-darwin-arm64 $(pwd)/bazel-remote-${{ env.VERSION }}-darwin-arm64
      - name: upload darwin binaries
        id: upload-release-assets-darwin
        uses: xresloader/upload-to-github-release@7c5757a90c0bcf0c0e1741da8f2abd7b85e675d0 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: bazel-remote-${{ env.VERSION }}-darwin-*
          overwrite: true
          tag_name: ${{ env.RELEASE_TAG }}
